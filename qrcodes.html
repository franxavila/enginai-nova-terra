<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENGinAI — QR Codes de Mesa Nova Terra</title>

    <!-- Tailwind CSS & QRCode.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .page-break { page-break-after: always; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">

    <!-- CONTROLES DE IMPRESSÃO -->
    <header class="max-w-4xl mx-auto mb-8 flex justify-between items-center no-print bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-xl">
        <div>
            <h1 class="text-base font-bold text-amber-400">Gerador de QR Codes de Mesa</h1>
            <p class="text-xs text-slate-400">Identificação física de mesa para o Nova Terra (v1.0.0)</p>
        </div>
        <button onclick="window.print()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs px-4 py-2 rounded-lg shadow-md transition">
            🖨️ Imprimir Folhas A4
        </button>
    </header>

    <!-- GRADE DE CARTÕES DE MESA -->
    <main class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6" id="qr-container">
        <!-- Gerado via Script -->
    </main>

    <script>
        const totalMesas = 5;
        const baseUrl = window.location.href.replace('qrcodes.html', 'index.html');
        const container = document.getElementById('qr-container');

        for (let i = 1; i <= totalMesas; i++) {
            const mesaNum = String(i).padStart(2, '0');
            const mesaUrl = `${baseUrl}?mesa=${mesaNum}`;

            const card = document.createElement('div');
            card.className = "bg-white text-slate-900 p-6 rounded-2xl border-4 border-amber-500 shadow-2xl flex flex-col items-center justify-between text-center min-h-[380px]";
            card.innerHTML = `
                <div>
                    <span class="text-[10px] font-extrabold uppercase tracking-widest text-slate-500">Restaurante</span>
                    <h2 class="text-xl font-black text-slate-900">Nova Terra</h2>
                </div>

                <div class="my-4 p-3 bg-slate-50 rounded-xl border border-slate-200" id="qrcode-mesa-${mesaNum}"></div>

                <div>
                    <span class="bg-amber-500 text-slate-950 font-black text-sm px-4 py-1.5 rounded-full uppercase tracking-wider">
                        MESA ${mesaNum}
                    </span>
                    <p class="text-[11px] font-semibold text-slate-600 mt-3">
                        Aponte a câmera do seu celular para ver o cardápio e fazer seu pedido.
                    </p>
                </div>
            `;

            container.appendChild(card);

            // Gerar QR Code
            setTimeout(() => {
                new QRCode(document.getElementById(`qrcode-mesa-${mesaNum}`), {
                    text: mesaUrl,
                    width: 160,
                    height: 160,
                    colorDark : "#0f172a",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            }, 100);
        }
    </script>
</body>
</html>
