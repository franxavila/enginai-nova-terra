<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ENGinAI — Painel Gestor Nova Terra</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">

    <!-- Tailwind CSS, FontAwesome & Supabase JS SDK -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        .pb-safe { padding-bottom: calc(5rem + env(safe-area-inset-bottom)); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-safe font-sans antialiased">

    <!-- HEADER DO PAINEL GESTOR -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 px-4 py-3 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold">
                <i class="fa-solid fa-sliders"></i>
            </div>
            <div>
                <h1 class="text-sm font-bold text-slate-100">Painel do Gestor</h1>
                <p class="text-[10px] text-slate-400 flex items-center gap-1.5 mt-0.5">
                    <span id="wakelock-status-badge" class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-1.5 py-0.2 rounded text-[9px] font-bold flex items-center gap-1">
                        <i class="fa-solid fa-lightbulb text-[8px]"></i> Tela Acesa
                    </span>
                    <span>• Auto-Sync Active</span>
                </p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="carregarProdutosDoSupabase()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 p-1.5 rounded-lg text-xs border border-slate-600" title="Recarregar Dados">
                <i class="fa-solid fa-rotate"></i>
            </button>
            <button onclick="solicitarWakeLockManual()" class="bg-slate-700 hover:bg-slate-600 text-amber-400 p-1.5 rounded-lg text-xs border border-slate-600" title="Manter Tela Acesa">
                <i class="fa-solid fa-sun"></i>
            </button>
            <button onclick="abrirModalNovoPrato()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 transition">
                <i class="fa-solid fa-plus text-[10px]"></i> Novo Prato
            </button>
        </div>
    </header>

    <!-- STATUS RÁPIDO DO CARDÁPIO (INDICADORES EM TEMPO REAL) -->
    <section class="p-4 grid grid-cols-2 gap-3 max-w-lg mx-auto">
        <div class="bg-slate-800 p-3 rounded-xl border border-slate-700/80">
            <span class="text-[10px] font-semibold text-slate-400 uppercase">Itens Ativos</span>
            <p class="text-lg font-bold text-emerald-400 mt-0.5" id="count-ativos">0 Pratos</p>
        </div>
        <div class="bg-slate-800 p-3 rounded-xl border border-slate-700/80">
            <span class="text-[10px] font-semibold text-slate-400 uppercase">Esgotados / Pausados</span>
            <p class="text-lg font-bold text-rose-400 mt-0.5" id="count-pausados">0 Itens</p>
        </div>
    </section>

    <!-- LISTAGEM E EDIÇÃO DE PRATOS COM REALTIME SYNC -->
    <main class="px-4 max-w-lg mx-auto space-y-3" id="admin-products-list">
        <p id="loading-msg" class="text-center text-xs text-slate-500 py-8">Sincronizando cardápio do Supabase...</p>
    </main>

    <!-- MODAL DE CADASTRO COM CÂMERA E GALERIA -->
    <div id="modal-prato" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="font-bold text-sm text-slate-100">Cadastrar Novo Prato</h3>
                <button onclick="fecharModalPrato()" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="space-y-3">
                <div>
                    <label class="text-[11px] font-medium text-slate-400">Nome do Prato</label>
                    <input type="text" id="input-nome" placeholder="Ex: Filé à Parmegiana" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500 mt-1">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[11px] font-medium text-slate-400">Preço (R$)</label>
                        <input type="number" id="input-preco" placeholder="00.00" step="0.50" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500 mt-1">
                    </div>
                    <div>
                        <label class="text-[11px] font-medium text-slate-400">Categoria</label>
                        <select id="select-categoria" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500 mt-1">
                            <option value="Executivos">Executivos</option>
                            <option value="Massas">Massas</option>
                            <option value="Sobremesas">Sobremesas</option>
                            <option value="Bebidas">Bebidas</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="text-[11px] font-medium text-slate-400">Descrição do Prato</label>
                    <input type="text" id="input-descricao" placeholder="Acompanhamentos e ingredientes..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500 mt-1">
                </div>

                <!-- ÁREA DE UPLOAD DA FOTO (CÂMERA / GALERIA) -->
                <div class="border-t border-slate-700/80 pt-3">
                    <label class="text-[11px] font-bold text-amber-400 flex items-center gap-1">
                        <i class="fa-solid fa-camera"></i> Foto do Prato
                    </label>
                    <p class="text-[10px] text-slate-400 mt-0.5">Tire uma foto pelo celular ou escolha da galeria:</p>

                    <div class="mt-2 flex items-center gap-3">
                        <label for="input-file-foto" class="cursor-pointer bg-slate-700 hover:bg-slate-600 text-slate-100 text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-2 border border-slate-600 transition">
                            <i class="fa-solid fa-upload text-amber-400"></i> Tirar Foto / Galeria
                        </label>
                        <input type="file" id="input-file-foto" accept="image/*" capture="environment" onchange="previewFotoSelecionada(this)" class="hidden">
                        
                        <div id="preview-container" class="hidden flex items-center gap-2">
                            <img id="img-preview" src="" class="w-10 h-10 rounded-lg object-cover border border-amber-500">
                            <span class="text-[10px] text-emerald-400 font-bold">Foto pronta!</span>
                        </div>
                    </div>

                    <div class="mt-2">
                        <span class="text-[9px] text-slate-500 uppercase font-semibold">Ou cole o link de uma imagem (opcional):</span>
                        <input type="text" id="input-foto-url" placeholder="https://..." class="w-full bg-slate-900/60 border border-slate-800 rounded-lg px-2.5 py-1.5 text-[11px] text-slate-300 focus:outline-none focus:border-amber-500 mt-1">
                    </div>
                </div>
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="fecharModalPrato()" class="w-1/2 bg-slate-700 text-slate-300 font-bold text-xs py-2.5 rounded-xl">Cancelar</button>
                <button onclick="salvarPratoSupabase()" id="btn-salvar-prato" class="w-1/2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs py-2.5 rounded-xl shadow-lg flex items-center justify-center gap-2">
                    <span>Salvar Prato</span>
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE SINCRONIZAÇÃO EM TEMPO REAL & WAKE LOCK -->
    <script>
        const SUPABASE_URL = 'https://riwinsdveamjhgxumnpe.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_z5h3mIH6oANIvJ53nozOgw_1fAuiuBi';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let produtosCache = [];
        let wakeLockObj = null;

        document.addEventListener('DOMContentLoaded', () => {
            // 1. Ativar trava de tela acesa (Screen Wake Lock) para a Paola
            ativarScreenWakeLock();

            // 2. Hydration inicial: Carregar produtos do PostgreSQL imediatamente
            carregarProdutosDoSupabase();
            
            // 3. Escuta ativa via WebSockets (Realtime) para qualquer alteração na tabela 'produtos'
            supabaseClient
                .channel('admin-products-realtime-channel')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'produtos' }, payload => {
                    console.log('🔄 MUDANÇA DETECTADA NO ADMIN (REALTIME):', payload);
                    carregarProdutosDoSupabase();
                })
                .subscribe();
        });

        // SCREEN WAKE LOCK API
        async function ativarScreenWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLockObj = await navigator.wakeLock.request('screen');
                    atualizarBadgeWakeLock(true);
                } else {
                    atualizarBadgeWakeLock(false);
                }
            } catch (err) {
                atualizarBadgeWakeLock(false);
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLockObj !== null && document.visibilityState === 'visible') {
                await ativarScreenWakeLock();
            }
        });

        function solicitarWakeLockManual() {
            ativarScreenWakeLock();
            alert("💡 Modo Salão: A tela do painel do gestor permanecerá ACESA continuamente!");
        }

        function atualizarBadgeWakeLock(ativo) {
            const badge = document.getElementById('wakelock-status-badge');
            if (!badge) return;

            if (ativo) {
                badge.className = "bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-1.5 py-0.2 rounded text-[9px] font-bold flex items-center gap-1";
                badge.innerHTML = `<i class="fa-solid fa-lightbulb text-[8px]"></i> Tela Acesa`;
            } else {
                badge.className = "bg-rose-500/20 text-rose-400 border border-rose-500/30 px-1.5 py-0.2 rounded text-[9px] font-bold flex items-center gap-1";
                badge.innerHTML = `<i class="fa-solid fa-moon text-[8px]"></i> Tela Normal`;
            }
        }

        // CARREGAMENTO E SINCRONIZAÇÃO DO BANCO
        async function carregarProdutosDoSupabase() {
            try {
                const { data, error } = await supabaseClient
                    .from('produtos')
                    .select('*')
                    .order('id', { ascending: true });

                if (error) throw error;

                produtosCache = data || [];
                renderizarListaProdutos(produtosCache);
            } catch (err) {
                console.error("Erro ao carregar produtos:", err.message);
                document.getElementById('loading-msg').innerText = "Erro ao sincronizar cardápio com o Supabase.";
            }
        }

        function renderizarListaProdutos(produtos) {
            const container = document.getElementById('admin-products-list');
            container.innerHTML = '';

            let ativos = 0;
            let pausados = 0;

            if (produtos.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-slate-500 py-8">Nenhum prato cadastrado no banco.</p>`;
                return;
            }

            produtos.forEach(prato => {
                if (prato.ativo) ativos++;
                else pausados++;

                const statusBtnClass = prato.ativo 
                    ? "bg-emerald-500/20 text-emerald-400 border-emerald-500/30" 
                    : "bg-rose-500/20 text-rose-400 border-rose-500/30";
                
                const statusText = prato.ativo ? "Ativo" : "Pausado";

                const cardHTML = `
                    <article class="bg-slate-800 rounded-xl p-3 border border-slate-700/80 shadow-md flex items-center justify-between gap-3">
                        <img src="${prato.imagem_url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=300&q=80'}" alt="${prato.nome}" class="w-16 h-16 rounded-lg object-cover">
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold text-xs text-slate-100 truncate">${prato.nome}</h3>
                            <p class="text-[11px] text-amber-400 font-bold mt-0.5">R$ ${Number(prato.preco).toFixed(2)}</p>
                            <span class="inline-block text-[9px] bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded mt-1">${prato.categoria || 'Geral'}</span>
                        </div>
                        <div class="flex flex-col items-end gap-2">
                            <button onclick="toggleStatusPratoSupabase(${prato.id}, ${prato.ativo})" class="status-toggle text-[10px] font-bold px-2.5 py-1 rounded-full border ${statusBtnClass}">
                                <i class="fa-solid fa-circle text-[8px] mr-1"></i> ${statusText}
                            </button>
                            <button onclick="editarPrecoPratoSupabase(${prato.id}, '${prato.nome.replace(/'/g, "\\'")}', ${prato.preco})" class="text-slate-400 hover:text-amber-400 text-xs p-1">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                        </div>
                    </article>
                `;
                container.insertAdjacentHTML('beforeend', cardHTML);
            });

            document.getElementById('count-ativos').innerText = `${ativos} Prato(s)`;
            document.getElementById('count-pausados').innerText = `${pausados} Item(ns)`;
        }

        function previewFotoSelecionada(input) {
            const container = document.getElementById('preview-container');
            const img = document.getElementById('img-preview');
            
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    img.src = e.target.result;
                    container.classList.remove('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function toggleStatusPratoSupabase(id, statusAtual) {
            try {
                const { error } = await supabaseClient
                    .from('produtos')
                    .update({ ativo: !statusAtual })
                    .eq('id', id);

                if (error) throw error;
            } catch (err) {
                alert("Erro ao alterar disponibilidade no Supabase!");
            }
        }

        async function editarPrecoPratoSupabase(id, nome, precoAtual) {
            let novoPreco = prompt(`Alterar preço de "${nome}":`, Number(precoAtual).toFixed(2));
            if (novoPreco !== null && !isNaN(novoPreco) && novoPreco.trim() !== '') {
                try {
                    const { error } = await supabaseClient
                        .from('produtos')
                        .update({ preco: parseFloat(novoPreco) })
                        .eq('id', id);

                    if (error) throw error;
                    alert(`✅ Preço atualizado com sucesso!`);
                } catch (err) {
                    alert("Erro ao atualizar preço!");
                }
            }
        }

        function abrirModalNovoPrato() {
            document.getElementById('modal-prato').classList.remove('hidden');
        }

        function fecharModalPrato() {
            document.getElementById('modal-prato').classList.add('hidden');
            document.getElementById('preview-container').classList.add('hidden');
            document.getElementById('input-file-foto').value = '';
            document.getElementById('input-foto-url').value = '';
        }

        async function salvarPratoSupabase() {
            const nome = document.getElementById('input-nome').value.trim();
            const preco = document.getElementById('input-preco').value;
            const categoria = document.getElementById('select-categoria').value;
            const descricao = document.getElementById('input-descricao').value.trim();
            const urlInformada = document.getElementById('input-foto-url').value.trim();
            const fileInput = document.getElementById('input-file-foto');
            const btnSalvar = document.getElementById('btn-salvar-prato');

            if (!nome || !preco) {
                alert("Por favor, preencha o Nome e o Preço do prato!");
                return;
            }

            btnSalvar.disabled = true;
            btnSalvar.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Salvando...`;

            let imagemFinal = urlInformada || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=80';

            if (fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;

                try {
                    const { error: uploadError } = await supabaseClient.storage
                        .from('cardapio-fotos')
                        .upload(fileName, file);

                    if (uploadError) throw uploadError;

                    const { data: publicUrlData } = supabaseClient.storage
                        .from('cardapio-fotos')
                        .getPublicUrl(fileName);

                    imagemFinal = publicUrlData.publicUrl;
                } catch (storageErr) {
                    console.error("Erro no upload da foto:", storageErr);
                    alert("Aviso: Usaremos a imagem padrão para o prato.");
                }
            }

            try {
                const { error } = await supabaseClient
                    .from('produtos')
                    .insert([
                        {
                            nome,
                            preco: parseFloat(preco),
                            categoria,
                            descricao: descricao || 'Prato preparado com ingredientes selecionados do Nova Terra.',
                            imagem_url: imagemFinal,
                            ativo: true
                        }
                    ]);

                if (error) throw error;

                alert(`🎉 Prato "${nome}" cadastrado com sucesso!`);
                fecharModalPrato();
                
                document.getElementById('input-nome').value = '';
                document.getElementById('input-preco').value = '';
                document.getElementById('input-descricao').value = '';
            } catch (err) {
                alert("Erro ao cadastrar novo prato no Supabase!");
                console.error(err);
            } finally {
                btnSalvar.disabled = false;
                btnSalvar.innerHTML = `<span>Salvar Prato</span>`;
            }
        }
    </script>
</body>
</html>
